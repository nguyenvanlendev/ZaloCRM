name: CI/CD Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Bỏ qua bước backup DB trước khi deploy (chỉ dùng khi khẩn cấp)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── BƯỚC 1: CI TEST, CHECK, BUILD & PUSH DOCKER IMAGE LÊN DOCKER HUB ────────
  # Toàn bộ việc kiểm thử cú pháp, build TypeScript và build Docker image được thực
  # hiện 100% trên GitHub Runner. TUYỆT ĐỐI KHÔNG BUILD TRÊN SERVER PRODUCTION.
  ci-build-push:
    name: CI Test, Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Docker Compose Syntax
        run: |
          docker compose config --quiet
          docker compose -f docker-compose-yoedu-crm.yml config --quiet
          echo "✓ Docker Compose files are valid."

      - name: Test & Validate Backend (TypeScript + Prisma)
        run: |
          cd backend
          npm ci
          DATABASE_URL="postgresql://build:build@localhost:5432/build" npx prisma generate
          npm run build
          echo "✓ Backend build PASSED (0 errors)."

      - name: Test & Validate Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
          echo "✓ Frontend build PASSED (0 errors)."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zalo-crm-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/zalo-crm-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── BƯỚC 2: DEPLOY LÊN SERVER PRODUCTION QUA SSH (PULL IMAGE, ZERO BUILD) ───
  # Server production (4 CPU / 8GB RAM) CHỈ PULL IMAGE ĐÃ BUILD, KHÔNG CẦN CÀI GIT
  deploy-production:
    name: Deploy to Production Server (Pull & Migrate)
    needs: ci-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST || '180.93.172.36' }}
          username: ${{ secrets.PROD_USER || 'root' }}
          password: ${{ secrets.PROD_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          timeout: 300s
          script: |
            set -euo pipefail

            TARGET_DIR="${{ secrets.PROD_APP_DIR || '/root/YOEDU/YOEDUCRM' }}"
            echo "=========================================================="
            echo "  BẮT ĐẦU TRIỂN KHAI ZALOCRM TẠI: ${TARGET_DIR}"
            echo "=========================================================="

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Lỗi: Không tìm thấy thư mục ${TARGET_DIR} trên server!" >&2
              exit 1
            fi

            cd "$TARGET_DIR"

            # Xác định file docker-compose được sử dụng trên server
            COMPOSE_FILE="${{ secrets.COMPOSE_FILE || 'docker-compose-yoedu-crm.yml' }}"
            if [ ! -f "$COMPOSE_FILE" ]; then
              if [ -f "docker-compose.yml" ]; then
                COMPOSE_FILE="docker-compose.yml"
              else
                echo "Lỗi: Không tìm thấy file compose ($COMPOSE_FILE hoặc docker-compose.yml) tại ${TARGET_DIR}!" >&2
                exit 1
              fi
            fi
            echo "✓ Đang sử dụng Docker Compose: ${COMPOSE_FILE}"

            # Đảm bảo service app trong compose trỏ tới tag latest
            DOCKER_IMG="${{ secrets.DOCKERHUB_USERNAME || 'lennguyen03' }}/zalo-crm-app:latest"
            sed -i -E "s|image:[[:space:]]*.*zalo-crm-app:.*|image: ${DOCKER_IMG}|g" "$COMPOSE_FILE"

            # 1. Tự động sao lưu Database trước khi deploy (An toàn tuyệt đối)
            SKIP_BACKUP="${{ github.event.inputs.skip_backup || 'false' }}"
            if [ "$SKIP_BACKUP" != "true" ]; then
              echo "▶ 1/6: Tự động sao lưu Database phòng ngừa..."
              mkdir -p ./backups
              BACKUP_FILE="./backups/pre-deploy-$(date +%Y%m%d_%H%M%S).sql"
              DB_ID=$(docker compose -f "$COMPOSE_FILE" ps -q db 2>/dev/null || docker ps -q -f name=zalo-crm-db || echo "")
              if [ -n "$DB_ID" ]; then
                DB_USER=$(grep -E "^DB_USER=" .env 2>/dev/null | cut -d= -f2- || echo "crmuser")
                DB_NAME=$(grep -E "^DB_NAME=" .env 2>/dev/null | cut -d= -f2- || echo "zalocrm")
                docker exec "$DB_ID" pg_dump -U "${DB_USER:-crmuser}" "${DB_NAME:-zalocrm}" > "$BACKUP_FILE" || {
                  echo "Cảnh báo: Không thể backup bằng container db, tiếp tục kiểm tra..."
                }
                if [ -s "$BACKUP_FILE" ]; then
                  echo "✓ Backup thành công: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
                fi
              else
                echo "Container database chưa chạy, bỏ qua bước dump trước deploy."
              fi
            fi

            # 2. Đăng nhập Docker Hub trên server (nếu repository private)
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true
            fi

            # 3. Kéo Docker Image đã build từ Docker Hub về server (KHÔNG BUILD TRÊN SERVER)
            echo "▶ 2/6: Kéo Docker Image mới nhất từ Docker Hub..."
            docker compose -f "$COMPOSE_FILE" pull app

            # 4. Chạy Prisma Database Migration với image mới vừa tải về
            echo "▶ 3/6: Áp dụng Prisma Database Migration..."
            docker compose -f "$COMPOSE_FILE" run --rm app npx prisma migrate deploy

            # 5. Khởi động lại App container với cờ --no-build (TUYỆT ĐỐI KHÔNG BUILD)
            echo "▶ 4/6: Khởi động lại container bằng image mới (no-build)..."
            docker compose -f "$COMPOSE_FILE" up -d --no-build app

            # 6. Kiểm tra sức khỏe (Healthcheck)
            echo "▶ 5/6: Chờ hệ thống sẵn sàng và kiểm tra Healthcheck..."
            APP_PORT=$(grep -E "^APP_PORT=" .env 2>/dev/null | cut -d= -f2- || echo "3080")
            HEALTH_PASSED=false
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${APP_PORT}/" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "✓ Ứng dụng đã sẵn sàng (HTTP $HTTP_CODE tại port $APP_PORT)!"
                HEALTH_PASSED=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_PASSED" != "true" ]; then
              echo "✗ CẢNH BÁO: App không phản hồi HTTP 200 trong 60 giây!" >&2
              echo "Vui lòng kiểm tra log: docker compose -f $COMPOSE_FILE logs --tail 100 app" >&2
              exit 1
            fi

            # 7. Tối ưu hóa Database Planner sau deploy & Dọn dẹp images cũ
            echo "▶ 6/6: Tối ưu hóa Database & dọn dẹp Docker..."
            DB_ID=$(docker compose -f "$COMPOSE_FILE" ps -q db 2>/dev/null || docker ps -q -f name=zalo-crm-db || echo "")
            if [ -n "$DB_ID" ]; then
              DB_USER=$(grep -E "^DB_USER=" .env 2>/dev/null | cut -d= -f2- || echo "crmuser")
              DB_NAME=$(grep -E "^DB_NAME=" .env 2>/dev/null | cut -d= -f2- || echo "zalocrm")
              docker exec "$DB_ID" psql -U "${DB_USER:-crmuser}" -d "${DB_NAME:-zalocrm}" \
                -c "VACUUM ANALYZE conversations; VACUUM ANALYZE messages; VACUUM ANALYZE appointments; VACUUM ANALYZE friends;" || true
            fi
            docker image prune -f || true

            echo "=========================================================="
            echo "✓ TRIỂN KHAI HOÀN TẤT: ĐÃ PULL IMAGE & MIGRATE THÀNH CÔNG!"
            echo "=========================================================="
