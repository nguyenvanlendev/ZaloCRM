name: CI/CD Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Bỏ qua bước backup DB trước khi deploy (chỉ dùng khi khẩn cấp)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── BƯỚC 1: KIỂM THỬ CHẤT LƯỢNG MÃ NGUỒN (CI) ──────────────────────────────
  quality-check:
    name: Build & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Docker Compose Syntax
        run: |
          docker compose config --quiet
          echo "Docker Compose file is valid."

      - name: Build & Validate Backend
        run: |
          cd backend
          npm ci
          DATABASE_URL="postgresql://build:build@localhost:5432/build" npx prisma generate
          npm run build
          echo "Backend build PASSED (0 errors)."

      - name: Build & Validate Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
          echo "Frontend build PASSED (0 errors)."

  # ── BƯỚC 2: TRIỂN KHAI LÊN SERVER PRODUCTION (CD) ──────────────────────────
  deploy-production:
    name: Deploy to Production Server
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          timeout: 300s
          script: |
            set -euo pipefail

            TARGET_DIR="${{ secrets.PROD_APP_DIR || '/opt/zalocrm' }}"
            echo "=========================================================="
            echo "  BẮT ĐẦU TRIỂN KHAI ZALOCRM TẠI: ${TARGET_DIR}"
            echo "=========================================================="

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Lỗi: Không tìm thấy thư mục ${TARGET_DIR} trên server!" >&2
              exit 1
            fi

            cd "$TARGET_DIR"

            # 1. Kéo mã nguồn mới nhất từ branch main
            echo "▶ 1/6: Cập nhật mã nguồn git..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Tự động sao lưu Database trước khi deploy (An toàn tuyệt đối)
            SKIP_BACKUP="${{ github.event.inputs.skip_backup || 'false' }}"
            if [ "$SKIP_BACKUP" != "true" ]; then
              echo "▶ 2/6: Tự động sao lưu Database phòng ngừa..."
              mkdir -p ./backups
              BACKUP_FILE="./backups/pre-deploy-$(date +%Y%m%d_%H%M%S).sql"
              if docker ps -q -f name=zalo-crm-db | grep -q .; then
                docker exec zalo-crm-db pg_dump -U "${DB_USER:-crmuser}" "${DB_NAME:-zalocrm}" > "$BACKUP_FILE" || {
                  echo "Cảnh báo: Không thể backup bằng container, tiếp tục kiểm tra..."
                }
                if [ -s "$BACKUP_FILE" ]; then
                  echo "✓ Backup thành công: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
                fi
              else
                echo "Container database chưa chạy, bỏ qua bước dump trước deploy."
              fi
            fi

            # 3. Chạy Prisma Database Migrations (Zero downtime)
            echo "▶ 3/6: Áp dụng Prisma Database Migration..."
            if docker ps -q -f name=zalo-crm-app | grep -q .; then
              docker exec zalo-crm-app npx prisma migrate deploy || {
                echo "Migration qua container đang chạy thất bại, thử qua compose run..."
                docker compose run --rm app npx prisma migrate deploy
              }
            else
              docker compose run --rm app npx prisma migrate deploy
            fi

            # 4. Rebuild và Khởi động lại App container (Tự động bỏ qua ClamAV để tiết kiệm 1.5GB RAM)
            echo "▶ 4/6: Rebuild và khởi động container..."
            docker compose up -d --build app

            # 5. Kiểm tra sức khỏe (Healthcheck)
            echo "▶ 5/6: Chờ hệ thống sẵn sàng và kiểm tra Healthcheck..."
            APP_PORT=$(grep -E "^APP_PORT=" .env 2>/dev/null | cut -d= -f2- || echo "3080")
            HEALTH_PASSED=false
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${APP_PORT}/" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "✓ Ứng dụng đã sẵn sàng (HTTP $HTTP_CODE tại port $APP_PORT)!"
                HEALTH_PASSED=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_PASSED" != "true" ]; then
              echo "✗ CẢNH BÁO: App không phản hồi HTTP 200 trong 60 giây!" >&2
              echo "Vui lòng kiểm tra log: docker logs zalo-crm-app --tail 100" >&2
              exit 1
            fi

            # 6. Tối ưu hóa Database Planner sau deploy & Dọn dẹp images cũ
            echo "▶ 6/6: Tối ưu hóa Database & dọn dẹp Docker..."
            docker exec zalo-crm-db psql -U "${DB_USER:-crmuser}" -d "${DB_NAME:-zalocrm}" \
              -c "VACUUM ANALYZE conversations; VACUUM ANALYZE messages; VACUUM ANALYZE appointments; VACUUM ANALYZE friends;" || true
            docker image prune -f || true

            echo "=========================================================="
            echo "✓ TRIỂN KHAI THÀNH CÔNG LÊN PRODUCTION!"
            echo "=========================================================="
